{{define "content"}}
<form method="post" action="/invoices/new/single" class="bg-white rounded-2xl shadow-sm p-6 max-w-3xl space-y-4">
  {{if .Error}}<div class="p-3 rounded-xl bg-rose-50 text-rose-700 text-sm">{{.Error}}</div>{{end}}
  <h2 class="text-lg font-semibold text-slate-900">{{t "invoices.single.title"}}</h2>

  <div>
    <label class="text-xs font-medium text-slate-600">{{t "invoices.month"}}</label>
    <div class="mt-1 grid grid-cols-2 gap-2">
      <select name="month_num" required
              class="w-full rounded-lg border border-slate-200 px-3 py-2 focus:ring-2 focus:ring-teal-400 focus:outline-none bg-white">
        {{range .MonthOptions}}
        <option value="{{.Value}}" {{if eq .Value $.SelectedMonth}}selected{{end}}>{{.Label}}</option>
        {{end}}
      </select>
      <select name="year" required
              class="w-full rounded-lg border border-slate-200 px-3 py-2 focus:ring-2 focus:ring-teal-400 focus:outline-none bg-white">
        {{range .YearOptions}}
        <option value="{{.}}" {{if eq . $.SelectedYear}}selected{{end}}>{{.}}</option>
        {{end}}
      </select>
    </div>
  </div>

  <div>
    <label class="text-xs font-medium text-slate-600">{{t "invoices.single.athlete"}}</label>
    <select name="athlete_id" required
            class="mt-1 w-full rounded-lg border border-slate-200 px-3 py-2 focus:ring-2 focus:ring-teal-400 focus:outline-none bg-white">
      {{range .Athletes}}
      <option value="{{.ID}}" {{if eq .ID $.SelectedAthlete}}selected{{end}}>{{.Name}}</option>
      {{end}}
    </select>
  </div>

  <div>
    <label class="text-xs font-medium text-slate-600">{{t "invoices.tipp_default"}}</label>
    <textarea name="tipp" rows="3" placeholder="{{t "invoices.tipp_default_ph"}}"
              class="mt-1 w-full rounded-lg border border-slate-200 px-3 py-2 focus:ring-2 focus:ring-teal-400 focus:outline-none">{{.Tipp}}</textarea>
  </div>

  <div class="flex items-center justify-end gap-2 pt-2">
    <a href="/invoices" class="rounded-full border border-slate-200 px-5 py-2 text-sm">{{t "app.cancel"}}</a>
    <button type="submit" class="rounded-full bg-teal-500 hover:bg-teal-400 text-slate-900 font-semibold px-5 py-2 text-sm">{{t "invoices.preview"}}</button>
  </div>
</form>
{{end}}
