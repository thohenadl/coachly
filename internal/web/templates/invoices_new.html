{{define "content"}}
<form method="post" action="/invoices/new" class="bg-white rounded-2xl shadow-sm p-6 max-w-3xl space-y-4">
  {{if .Error}}<div class="p-3 rounded-xl bg-rose-50 text-rose-700 text-sm">{{.Error}}</div>{{end}}
  <div class="grid grid-cols-2 gap-4">
    <div>
      <label class="text-xs font-medium text-slate-600">{{t "invoices.month"}}</label>
      <input name="month" type="month" value="{{.Month}}" required
             class="mt-1 w-full rounded-lg border border-slate-200 px-3 py-2 focus:ring-2 focus:ring-teal-400 focus:outline-none" />
    </div>
  </div>
  <div>
    <label class="text-xs font-medium text-slate-600">{{t "invoices.tipp_default"}}</label>
    <textarea name="tipp_default" rows="3" placeholder="{{t "invoices.tipp_default_ph"}}"
              class="mt-1 w-full rounded-lg border border-slate-200 px-3 py-2 focus:ring-2 focus:ring-teal-400 focus:outline-none">{{.TippDefault}}</textarea>
  </div>

  {{if .Athletes}}
  <div>
    <div class="text-xs font-medium text-slate-600 mb-2">{{t "invoices.tipp_override"}}</div>
    <div class="space-y-2 max-h-96 overflow-y-auto pr-2">
      {{range .Athletes}}
      <div class="grid grid-cols-3 gap-2 items-start">
        <div class="text-sm py-2">{{.Name}}</div>
        <textarea name="tipp_{{.ID}}" rows="2" placeholder="{{$.PlaceholderOverride}}"
                  class="col-span-2 rounded-lg border border-slate-200 px-3 py-2 text-sm">{{.Override}}</textarea>
      </div>
      {{end}}
    </div>
  </div>
  {{end}}

  <div class="flex items-center justify-end gap-2 pt-2">
    <a href="/invoices" class="rounded-full border border-slate-200 px-5 py-2 text-sm">{{t "app.cancel"}}</a>
    <button type="submit" class="rounded-full bg-teal-500 hover:bg-teal-400 text-slate-900 font-semibold px-5 py-2 text-sm">{{t "invoices.preview"}}</button>
  </div>
</form>
{{end}}
